<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Mono">
  <!-- Ears -->
  <circle cx="20" cy="35" r="14" fill="#D4A574"/>
  <circle cx="20" cy="35" r="9" fill="#F5CBA7"/>
  <circle cx="80" cy="35" r="14" fill="#D4A574"/>
  <circle cx="80" cy="35" r="9" fill="#F5CBA7"/>
  <!-- Head -->
  <circle cx="50" cy="45" r="30" fill="#D4A574"/>
  <!-- Face -->
  <ellipse cx="50" cy="52" rx="20" ry="18" fill="#F5CBA7"/>
  <!-- Eyes -->
  <circle cx="40" cy="40" r="5" fill="#FFFFFF"/>
  <circle cx="60" cy="40" r="5" fill="#FFFFFF"/>
  <circle cx="41" cy="40" r="3" fill="#2D3436"/>
  <circle cx="61" cy="40" r="3" fill="#2D3436"/>
  <!-- Eye shine -->
  <circle cx="42.5" cy="38.5" r="1.2" fill="#FFFFFF"/>
  <circle cx="62.5" cy="38.5" r="1.2" fill="#FFFFFF"/>
  <!-- Nose -->
  <ellipse cx="50" cy="50" rx="3" ry="2" fill="#A0522D"/>
  <!-- Mouth (smile) -->
  <path d="M42 56 Q50 64 58 56" fill="none" stroke="#A0522D" stroke-width="2" stroke-linecap="round"/>
  <!-- Body -->
  <ellipse cx="50" cy="82" rx="18" ry="14" fill="#D4A574"/>
  <!-- Belly -->
  <ellipse cx="50" cy="84" rx="12" ry="10" fill="#F5CBA7"/>
</svg>
