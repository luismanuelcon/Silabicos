<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Rana">
  <!-- Back legs -->
  <ellipse cx="25" cy="82" rx="12" ry="7" fill="#00B894"/>
  <ellipse cx="75" cy="82" rx="12" ry="7" fill="#00B894"/>
  <!-- Body -->
  <ellipse cx="50" cy="65" rx="25" ry="20" fill="#00D2D3"/>
  <!-- Belly -->
  <ellipse cx="50" cy="68" rx="18" ry="15" fill="#E0FFF0"/>
  <!-- Head -->
  <ellipse cx="50" cy="40" rx="28" ry="22" fill="#00D2D3"/>
  <!-- Eye bumps -->
  <circle cx="35" cy="24" r="10" fill="#00D2D3"/>
  <circle cx="65" cy="24" r="10" fill="#00D2D3"/>
  <!-- Eyes -->
  <circle cx="35" cy="24" r="8" fill="#FFFFFF"/>
  <circle cx="65" cy="24" r="8" fill="#FFFFFF"/>
  <circle cx="36" cy="24" r="4.5" fill="#2D3436"/>
  <circle cx="66" cy="24" r="4.5" fill="#2D3436"/>
  <!-- Eye shine -->
  <circle cx="38" cy="22" r="1.8" fill="#FFFFFF"/>
  <circle cx="68" cy="22" r="1.8" fill="#FFFFFF"/>
  <!-- Nostrils -->
  <circle cx="45" cy="38" r="1.5" fill="#00B894"/>
  <circle cx="55" cy="38" r="1.5" fill="#00B894"/>
  <!-- Mouth (big smile) -->
  <path d="M32 46 Q50 58 68 46" fill="none" stroke="#00B894" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cheek blush -->
  <ellipse cx="30" cy="42" rx="5" ry="3" fill="#FF6B6B" opacity="0.3"/>
  <ellipse cx="70" cy="42" rx="5" ry="3" fill="#FF6B6B" opacity="0.3"/>
  <!-- Front legs/arms -->
  <path d="M28 60 Q18 65 15 72" fill="none" stroke="#00D2D3" stroke-width="5" stroke-linecap="round"/>
  <path d="M72 60 Q82 65 85 72" fill="none" stroke="#00D2D3" stroke-width="5" stroke-linecap="round"/>
  <!-- Toes -->
  <circle cx="13" cy="74" r="2.5" fill="#00B894"/>
  <circle cx="17" cy="76" r="2.5" fill="#00B894"/>
  <circle cx="87" cy="74" r="2.5" fill="#00B894"/>
  <circle cx="83" cy="76" r="2.5" fill="#00B894"/>
</svg>
